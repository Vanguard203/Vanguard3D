<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#081426">
<title>Vanguard3D - Battle Prototype</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#fff;font-family:system-ui,sans-serif;overflow:hidden}
header{height:58px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;background:#101e31;border-bottom:1px solid #35506f}
h1{font-size:18px;margin:0}.life{font-weight:700;font-size:14px}
main{height:calc(100dvh - 58px);display:flex;flex-direction:column;padding:12px;gap:10px}
.status{min-height:42px;padding:10px;border:1px solid #35506f;border-radius:12px;background:#12243a;font-size:14px}
.field{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-around;perspective:700px;border:1px solid #35506f;border-radius:18px;background:radial-gradient(ellipse at center,#183958,#09182a 70%);padding:12px;position:relative}
.zone{height:43%;display:flex;align-items:center;justify-content:center;gap:10px;transform:rotateX(-8deg);border:1px dashed #52708f;border-radius:14px;background:#ffffff08}
.zone small{position:absolute;top:6px;left:10px;color:#a9c4e4}.zone.enemy{transform:rotateX(8deg)}
.unit{width:min(27%,105px);height:105px;border-radius:14px;border:2px solid #7db9ff;background:linear-gradient(145deg,#3479b7,#132d50);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 8px 20px #0008;animation:pop .25s ease-out}
.enemy .unit{border-color:#ff9b86;background:linear-gradient(145deg,#b54a42,#4a1c2b)}
.unit b{font-size:12px;text-align:center}.unit strong{font-size:20px;margin-top:8px}
@keyframes pop{from{transform:scale(.5) translateY(20px);opacity:0}to{transform:scale(1);opacity:1}}
.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
button{border:0;border-radius:12px;padding:14px 4px;font-size:15px;font-weight:700;color:white;background:#1769aa;min-height:52px}
button:nth-child(2){background:#a94339}button:nth-child(3){background:#45566d}button:disabled{opacity:.35}
.note{text-align:center;color:#9db2ca;font-size:11px}
</style>
</head>
<body>
<header><h1>⚔ Vanguard3D</h1><div class="life" id="life">YOU ♥ 5　ENEMY ♥ 5</div></header>
<main>
<div class="status" id="status">あなたのターン！ユニットを召喚して攻撃しよう。</div>
<section class="field">
<div class="zone enemy" id="enemy"><small>ENEMY FIELD</small></div>
<div class="zone" id="player"><small>YOUR FIELD</small></div>
</section>
<div class="controls"><button id="summon">召喚</button><button id="attack">攻撃</button><button id="end">ターン終了</button></div>
<div class="note">スマホ向けブラウザ試作版・操作確認用</div>
</main>
<script>
const $=id=>document.getElementById(id);let you=[],foe=[],yl=5,fl=5,turn=1,summoned=false,over=false;
const names=['ブレード・ドラゴン','スターライト・ナイト','アストラル・ウィッチ'];
function say(t){$('status').textContent=t}
function render(){
 $('player').innerHTML='<small>YOUR FIELD</small>'+you.map(u=>'<div class="unit"><b>'+u.name+'</b><strong>'+u.pow+'</strong></div>').join('');
 $('enemy').innerHTML='<small>ENEMY FIELD</small>'+foe.map(u=>'<div class="unit"><b>'+u.name+'</b><strong>'+u.pow+'</strong></div>').join('');
 $('life').textContent='YOU ♥ '+yl+'　ENEMY ♥ '+fl;
 $('summon').disabled=over||summoned||you.length>=3;$('attack').disabled=over||you.length===0;$('end').disabled=over;
}
function check(){if(fl<=0){say('勝利！相手のライフを削り切った！');over=true}else if(yl<=0){say('敗北……もう一度挑戦しよう！');over=true}}
$('summon').onclick=()=>{if(over||summoned||you.length>=3)return;let i=you.length;you.push({name:names[(turn-1)%3],pow:10000+i*2000+(turn-1)*500});summoned=true;say(you.at(-1).name+'を召喚！');render()};
$('attack').onclick=()=>{if(over||!you.length)return;if(foe.length){foe.shift();say('アタック成功！相手ユニットを退却！')}else{fl--;say('ダイレクトアタック！相手ライフに1ダメージ！')}check();render()};
$('end').onclick=()=>{if(over)return;turn++;if(foe.length<3)foe.push({name:'ライバルユニット',pow:9000+turn*500});if(you.length)you.shift();summoned=false;say('相手ターン終了。あなたのターンだ！');check();render()};
render();
</script>
</body>
</html>
